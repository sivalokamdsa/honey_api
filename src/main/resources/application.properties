spring.application.name=honey-api
#DATABASE_URL=postgres://honey:Honey_Pass_2026@localhost:5432/honey_db


# --- Database (local Docker PostgreSQL from Step 2) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/honey_db
spring.datasource.username=honey
# ${DB_USER:honey}
spring.datasource.password=${DB_PASSWORD:honey_db}
#${DB_PASSWORD:Honey_Pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server ---
server.port=8080
server.forward-headers-strategy=framework

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Razorpay (set as environment variables, never hard-code) ---
razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}