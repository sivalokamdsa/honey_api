spring.application.name=honey-api
#DATABASE_URL=postgres://honey:Honey_Pass_2026@localhost:5432/honey_db


# --- Database (local Docker PostgreSQL from Step 2) ---
#spring.datasource.url=jdbc:postgresql://localhost:5433/honey_db
spring.datasource.url=jdbc:postgresql://localhost:5432/honey_db
spring.datasource.username=honey
# ${DB_USER:honey}
spring.datasource.password=Honey_Pass_2026
#${DB_PASSWORD:Honey_Pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server ---
server.port=8080
server.forward-headers-strategy=framework

# --- Auth ---
honey.auth.session-ttl-days=${HONEY_SESSION_TTL_DAYS:30}
# Registration phone to promote to ADMIN on startup (leave empty to do nothing)
honey.admin.bootstrap-phone=${HONEY_ADMIN_BOOTSTRAP_PHONE:}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Razorpay (set as environment variables, never hard-code) ---
